<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home-Maid | Premium Home Care Services</title>
  </head>
  <body>
    <div id="root">
      <!-- Premium Branded Preloader for Home-Maid -->
      <style>
        .hm-preloader-container {
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          background-color: #f8fafc;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          font-family: 'Outfit', 'Inter', -apple-system, sans-serif;
          z-index: 999999;
        }
        .hm-logo-container {
          position: relative;
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 24px;
        }
        .hm-pulse-circle {
          position: absolute;
          width: 100px;
          height: 100px;
          border-radius: 50%;
          background: rgba(13, 148, 136, 0.1);
          animation: pulse 2.2s infinite ease-in-out;
        }
        .hm-logo-svg {
          width: 64px;
          height: 64px;
          z-index: 10;
          color: #0d9488;
          animation: float 3s infinite ease-in-out;
        }
        .hm-title {
          font-size: 26px;
          font-weight: 800;
          letter-spacing: 0.15em;
          color: #0f766e;
          margin: 0 0 6px 0;
          text-transform: uppercase;
          text-align: center;
          opacity: 0;
          animation: fadeIn 0.8s forwards 0.2s;
        }
        .hm-subtitle {
          font-size: 13px;
          font-weight: 500;
          letter-spacing: 0.05em;
          color: #64748b;
          margin: 0;
          text-align: center;
          opacity: 0;
          animation: fadeIn 0.8s forwards 0.4s;
        }
        .hm-loading-bar-wrap {
          margin-top: 32px;
          width: 140px;
          height: 3px;
          background-color: #e2e8f0;
          border-radius: 10px;
          overflow: hidden;
        }
        .hm-loading-bar {
          width: 100%;
          height: 100%;
          background-color: #0d9488;
          border-radius: 10px;
          transform: translateX(-100%);
          animation: loadingBar 1.8s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes pulse {
          0% { transform: scale(0.85); opacity: 0.3; }
          50% { transform: scale(1.2); opacity: 0.7; }
          100% { transform: scale(0.85); opacity: 0.3; }
        }
        @keyframes float {
          0% { transform: translateY(0); }
          50% { transform: translateY(-6px); }
          100% { transform: translateY(0); }
        }
        @keyframes fadeIn {
          to { opacity: 1; }
        }
        @keyframes loadingBar {
          0% { transform: translateX(-100%); }
          50% { transform: translateX(0); }
          100% { transform: translateX(100%); }
        }
      </style>
      <div class="hm-preloader-container">
        <div class="hm-logo-container">
          <div class="hm-pulse-circle"></div>
          <svg class="hm-logo-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m2 22 1-1c.6-.6.6-1.6 0-2.2L1 17l8-8M17 14c-1.5 0-3-1.5-3-3s1.5-3 3-3V6c0-1.1-.9-2-2-2H9C7.9 4 7 4.9 7 6v4" />
            <path d="M14 14h6c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2" />
            <path d="m19 19-3-3M22 22l-2-2" />
            <path d="M12 2v2M2 12h2M5 5l1.5 1.5M19 5l-1.5 1.5" />
          </svg>
        </div>
        <h1 class="hm-title">Home-Maid</h1>
        <p class="hm-subtitle">Premium Home Care Services</p>
        <div class="hm-loading-bar-wrap">
          <div class="hm-loading-bar"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
